name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          set -eu
          find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -s sh
          find shell -type f ! -name inputrc -print0 | xargs -0 -r shellcheck -s bash
